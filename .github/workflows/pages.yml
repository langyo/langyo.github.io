# Deploy the Zola site to GitHub Pages.
#
# Pages serves the output of "zola build" only — this workflow replaces the old
# static-content deployment (static.yml, deleted) so the deployed artifact is
# the result of the same theme the checks workflow verified on the pull request.
#
# BASE URL (2026-11-16 fix): the canonical build (checks.yml, dockerfile,
# local "just build") uses config.toml's base_url = https://langyo.xyz, the
# production origin (a container behind Cloudflare). The Pages mirror lives at
# https://langyo.github.io, so building it with langyo.xyz baked in made every
# stylesheet/script/image URL point at the OLD production theme and the mirror
# rendered as unstyled HTML. Configure Pages first and hand its base_url to
# Zola so each deployment is self-consistent on its own origin.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Required by the Pages deployment API.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a production deployment mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.21.0"
  ZOLA_TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Sets the deployment origin; its base_url output is what the artifact
      # must reference (https://langyo.github.io today).
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Zola
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-${ZOLA_TARGET}.tar.gz" | tar -xz
          sudo install -m 0755 zola /usr/local/bin/zola
          zola --version
      - name: Build site
        run: zola build --base-url "${{ steps.pages.outputs.base_url }}"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
