base_url = "https://langyo.xyz"
title = "LANGYO"
description = "伊欧的个人空间站点"
theme = "hikari-zola"
default_language = "zh-Hans"
compile_sass = true
minify_html = false
generate_feeds = true
feed_filenames = ["atom.xml"]
generate_sitemap = true
generate_robots_txt = true
build_search_index = false

[[taxonomies]]
name = "tags"

[markdown]
highlight_code = true
highlight_theme = "css"
smart_punctuation = false
external_links_target_blank = false
external_links_no_follow = false

[link_checker]
skip_prefixes = [
  "https://space.bilibili.com",
  "https://steamcommunity.com",
  "https://beian.miit.gov.cn",
  "https://icp.gov.moe",
  "https://beian.mps.gov.cn",
]

[extra]
author = { name = "langyo", email = "langyo.china@gmail.com" }
menu = [
  { name = "记录", url = "/posts/" },
  { name = "标签", url = "/tags/" },
  { name = "关于", url = "/about/" },
]
social = [
  { name = "GitHub", url = "https://github.com/langyo" },
  { name = "Email", url = "mailto:langyo.china@gmail.com" },
  { name = "Bilibili", url = "https://space.bilibili.com/5741197" },
  { name = "Steam", url = "https://steamcommunity.com/id/langyo_china" },
]
footer_copyright = "CC BY-NC 4.0"
footer_recordation_text = "沪ICP备20025013号-2"
footer_recordation_text_security = "沪公网安备31011502403090号"
footer_recordation_text_security_code = "31011502403090"
footer_recordation_text_moe = "萌ICP备20255233号"

# --------------------------------------------------------------------------
# HERO / OPERATOR FILE
# 千禧年（Millennium）操作员档案口吻：中文为主，穿插少量英文 HUD 读数。
# --------------------------------------------------------------------------
[extra.hero]
kicker = "OPERATOR FILE"
datalines = [
  { k = "CLASS", v = "FULL-STACK" },
  { k = "REGION", v = "SHANGHAI · CN" },
  { k = "CORE", v = "RUST / TS" },
  { k = "UPTIME", v = "10+ YRS" },
  { k = "STATUS", v = "ONLINE" },
]
cta = [
  { label = "进入记录", url = "/posts/" },
  { label = "操作员档案", url = "/about/" },
]

